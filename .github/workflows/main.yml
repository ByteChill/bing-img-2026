name: 'GitHub Actions BingPicApi'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
jobs:
  Bing-spider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: 'Working'
        timeout-minutes: 350
        run: bash ./bing.sh
      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$(date)" -a
          git push
